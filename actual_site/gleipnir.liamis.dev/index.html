<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gleipnir To do list</title>
  </head>
  <body>
      <div class="sidebar">

       <h3>Tools</h3>

      <span class="sidebar-item" onclick="openCreatePresetModal()">Create a Preset</span>

      <span class="sidebar-item" onclick="openCreateTestPlanModal()">Create Test Plan</span>

      <span class="sidebar-item" onclick="toggleTestPlans()">Test Plans</span>

     </div>

      <div id="create-test-plan-modal" class="preset-modal hidden">
        <div class="preset-modal-content">
          <h2>Create Test Plan</h2>
          <p class="preset-modal-hint">Forge a new test plan to guide thy QA crusade!</p>

          <label class="preset-modal-label" for="test-plan-title-input">Title</label>
          <input id="test-plan-title-input" class="preset-modal-input" type="text" placeholder="e.g. Login Flow Tests">

          <label class="preset-modal-label" for="test-plan-desc-input">Description</label>
          <input id="test-plan-desc-input" class="preset-modal-input" type="text" placeholder="What be this test plan about?">

          <label class="preset-modal-label" for="test-plan-markdown-input">Markdown Content</label>
          <textarea id="test-plan-markdown-input" class="preset-modal-textarea" rows="8" placeholder="Write thy test checklist in markdown..."></textarea>

          <div class="preset-modal-actions">
            <button class="preset-modal-cancel" onclick="cancelCreateTestPlanModal()">Cancel</button>
            <button class="preset-modal-confirm" onclick="confirmCreateTestPlanModal()">Create</button>
          </div>

          <p id="create-test-plan-error" class="preset-modal-error hidden"></p>
        </div>
      </div>

      <!-- ----------------------------------------------------------------
           Preset Creation Modal  (same pattern as Test Plan modal)
           ---------------------------------------------------------------- -->
      <div id="create-preset-modal" class="preset-modal hidden">
        <div class="preset-modal-content" style="max-width: 520px;">
          <h2>Create Preset</h2>
          <p class="preset-modal-hint">Forge a reusable task list for thy crusades!</p>

          <label class="preset-modal-label" for="preset-name-input">Preset Name</label>
          <input id="preset-name-input" class="preset-modal-input" type="text" placeholder="e.g. Weekend Grind">

          <label class="preset-modal-label" for="preset-author-input">Author</label>
          <input id="preset-author-input" class="preset-modal-input" type="text" placeholder="e.g. Liam">

          <label class="preset-modal-label" for="preset-desc-input">Description</label>
          <textarea id="preset-desc-input" class="preset-modal-textarea" rows="2" placeholder="What be this preset about?"></textarea>

          <label class="preset-modal-label" for="preset-task-input">Tasks</label>
          <div style="display:flex; gap:8px; margin-bottom:14px;">
            <input id="preset-task-input" class="preset-modal-input" type="text" placeholder="Enter a task name..."
              style="margin-bottom:0; flex:1;">
            <button onclick="addPresetTask()" style="white-space:nowrap; margin-left:0;">+ Add</button>
          </div>
          <ul id="preset-task-list" style="margin-bottom:14px;"></ul>

          <div class="preset-modal-actions">
            <button class="preset-modal-cancel" onclick="cancelCreatePresetModal()">Cancel</button>
            <button class="preset-modal-confirm" onclick="confirmCreatePresetModal()">Create Preset</button>
          </div>

          <p id="create-preset-error" class="preset-modal-error hidden"></p>
        </div>
      </div>

      <div id="test-plans-panel" class="test-plans-panel">
        <div id="test-plan-selector-screen" class="test-plan-screen">
          <div class="test-plans-header">
            <h3>Test Plans</h3>
            <button class="test-plans-close" onclick="toggleTestPlans()">X</button>
          </div>
          <div id="test-plan-selector" class="test-plan-selector"></div>
        </div>
        <div id="test-plan-content-screen" class="test-plan-screen" style="display:none">
          <div class="test-plans-header">
            <button class="test-plans-back" onclick="backToSelector()">←</button>
            <h3 id="test-plan-title">Test Plan</h3>
            <button class="test-plans-close" onclick="toggleTestPlans()">X</button>
          </div>
          <div id="test-plans-content" class="test-plans-content"></div>
        </div>
      </div>

      <h1>To Do List</h1>
      <input id="todo_input" type="text" name="todo" placeholder="Enter your next itme of buisness!">
      <button onclick="CreateTask()">Submit</button> 

      <div class="preset_box">
       <ul id="preset_list">

       </ul>
     </div>

      <ul id="todo_list">

      </ul>

  </body>
  <link href="style.css" rel="stylesheet">
  <script type="module" src="script.js" defer></script>
</html>
