<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gleipnir To do list</title>
    <script type="module" crossorigin src="/assets/index-C8me-uwP.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-d3rizTSS.css">
  </head>
  <body>
      <div class="sidebar">

       <h3>Tools</h3>

      <a class="sidebar-item" href="http://localhost:5173/create-preset/">Create a preset</a>

      <span class="sidebar-item" onclick="toggleTestPlans()">Test Plans</span>

     </div>

      <div id="test-plans-panel" class="test-plans-panel">
        <div id="test-plan-selector-screen" class="test-plan-screen">
          <div class="test-plans-header">
            <h3>Test Plans</h3>
            <button class="test-plans-close" onclick="toggleTestPlans()">X</button>
          </div>
          <div id="test-plan-selector" class="test-plan-selector"></div>
        </div>
        <div id="test-plan-content-screen" class="test-plan-screen" style="display:none">
          <div class="test-plans-header">
            <button class="test-plans-back" onclick="backToSelector()">←</button>
            <h3 id="test-plan-title">Test Plan</h3>
            <button class="test-plans-close" onclick="toggleTestPlans()">X</button>
          </div>
          <div id="test-plans-content" class="test-plans-content"></div>
        </div>
      </div>

      <h1>To Do List</h1>
      <input id="todo_input" type="text" name="todo" placeholder="Enter your next itme of buisness!">
      <button onclick="CreateTask()">Submit</button> 

      <div class="preset_box">
       <ul id="preset_list">

       </ul>
     </div>

      <ul id="todo_list">

      </ul>

  </body>
</html>
